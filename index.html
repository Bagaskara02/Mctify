<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>McMusic — Stream & Beautiful Lyrics</title>
    <meta name="description" content="Stream millions of songs with Apple Music-style synchronized lyrics, imported playlists from Spotify and YouTube Music, with zero database setup." />
    <meta name="theme-color" content="#07070a" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#07070a] text-slate-100 antialiased overflow-hidden select-none">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #07070a; color: #fff; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
        <div style="width: 36px; height: 36px; border: 3px solid rgba(0, 163, 255, 0.2); border-top-color: #00a3ff; border-radius: 50%; animation: mcmusic-spin 0.8s linear infinite;"></div>
        <p style="margin-top: 14px; font-size: 13px; color: #94a3b8; font-weight: 600; letter-spacing: 0.3px;">Memuat McMusic...</p>
        <style>@keyframes mcmusic-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
