name: Publish GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare McTify APK Asset
        run: |
          cp public/downloads/McMusic-arm64.apk McTify-v1.4.1-arm64.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.4.1}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" McTify-v1.4.1-arm64.apk public/downloads/McMusic-arm64.apk --clobber
          else
            gh release create "$TAG_NAME" McTify-v1.4.1-arm64.apk public/downloads/McMusic-arm64.apk \
              --title "McTify Mobile ${TAG_NAME} (Instant Skip, Zero 0:01 Stutter & Lockscreen Sync)" \
              --notes "Rilis ${TAG_NAME}: Optimasi klien manifest instan (androidSdkless ~200ms) + paralel search race, perbaikan bug audio macet/patah-patah di detik 00:01 (hapus static Range header & cegah seek-loop awal), token generasi async untuk skip cepat Lockscreen/Panel Notifikasi tanpa salah judul/lagu, serta perbaikan tap lagu pada Antrean Lagu berdasarkan indeks tepat."
          fi
