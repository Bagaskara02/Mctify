name: Publish GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare McTify APK Asset
        run: |
          cp public/downloads/McMusic-arm64.apk McTify-v1.4.3-arm64.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.4.3}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" McTify-v1.4.3-arm64.apk public/downloads/McMusic-arm64.apk --clobber
          else
            gh release create "$TAG_NAME" McTify-v1.4.3-arm64.apk public/downloads/McMusic-arm64.apk \
              --title "McTify Mobile ${TAG_NAME} (Full-Song Streaming Fixed + Zero 50s Cutoff)" \
              --notes "Rilis ${TAG_NAME}: Memperbaiki regresi lagu berhenti di kisaran detik ~50 dengan menggunakan stream progresif MP4 uncapped (itag 18) melalui AudioProxyServer agar seluruh lagu terputar tuntas dari 00:00 hingga habis, sambil mempertahankan kecepatan play awal, skip, transisi antar-lagu, dan rewind instan."
          fi
