name: Publish GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare McTify APK Asset
        run: |
          cp public/downloads/McMusic-arm64.apk McTify-v1.4.0-arm64.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.4.0}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" McTify-v1.4.0-arm64.apk public/downloads/McMusic-arm64.apk --clobber
          else
            gh release create "$TAG_NAME" McTify-v1.4.0-arm64.apk public/downloads/McMusic-arm64.apk \
              --title "McTify Mobile ${TAG_NAME} (Hi-Res Lossless, Instant Play & Unified Spotify UI)" \
              --notes "Rilis ${TAG_NAME}: Perbaikan gap MiniPlayer & BottomNav, optimasi cold-start audio playback instan (pre-warm Quick Cards + singleton client), penambahan mode Hi-Res Lossless (FLAC / Hi-Fi), serta pembaruan menyeluruh UI Home shortcuts, Lyrics ambient view, Library, Queue, Car Mode, dan Import."
          fi
