name: Publish GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare McTify APK Asset
        run: |
          cp public/downloads/McMusic-arm64.apk McTify-v1.4.2-arm64.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.4.2}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" McTify-v1.4.2-arm64.apk public/downloads/McMusic-arm64.apk --clobber
          else
            gh release create "$TAG_NAME" McTify-v1.4.2-arm64.apk public/downloads/McMusic-arm64.apk \
              --title "McTify Mobile ${TAG_NAME} (AudioProxy RAM Cache, 0ms Rewind & Instant Native ExoPlayer)" \
              --notes "Rilis ${TAG_NAME}: Mengatasi HTTP 403 googlevideo pada ExoPlayer dengan Local Loopback Chunked Range Proxy (AudioProxyServer) + pre-warm Chunk 0 ke RAM + read-ahead otomatis, AndroidLoadControl buffer 250ms & backBuffer 60s untuk play/skip/rewind super cepat, serta perbaikan slider seek di Car Mode & Lirik."
          fi
