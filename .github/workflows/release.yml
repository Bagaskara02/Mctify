name: Publish GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare McTify APK Asset
        run: |
          cp public/downloads/McMusic-arm64.apk McTify-arm64.apk
          TAG_NAME="${GITHUB_REF_NAME:-v1.4.4}"
          cp public/downloads/McMusic-arm64.apk "McTify-${TAG_NAME}-arm64.apk"

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.4.4}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" McTify-arm64.apk "McTify-${TAG_NAME}-arm64.apk" public/downloads/McMusic-arm64.apk --clobber
          else
            gh release create "$TAG_NAME" McTify-arm64.apk "McTify-${TAG_NAME}-arm64.apk" public/downloads/McMusic-arm64.apk \
              --title "McTify Mobile ${TAG_NAME} (iOS IPA & Android APK)" \
              --notes "Rilis ${TAG_NAME}: Perbaikan gap player dan bottom navigation bar (docking mulus persis Spotify), uncapped full-song streaming tanpa batas 50s, serta rilis paket iOS .ipa untuk iPhone dan Android APK."
          fi
