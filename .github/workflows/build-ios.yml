name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mcmusic_flutter
          flutter pub get

      - name: Build iOS App with Xcode (No CodeSign)
        run: |
          cd mcmusic_flutter
          flutter build ios --release --no-codesign --config-only
          cd ios
          pod install
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Payload into IPA
        run: |
          cd mcmusic_flutter
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/Runner.app build/Payload/
          cd build
          zip -r McMusic.ipa Payload
          ls -la McMusic.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: McMusic-iOS-IPA
          path: mcmusic_flutter/build/McMusic.ipa
          retention-days: 14
