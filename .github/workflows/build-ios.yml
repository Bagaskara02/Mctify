name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mcmusic_flutter/**'

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mcmusic_flutter
          flutter pub get

      - name: Build iOS Application (Release, No CodeSign)
        run: |
          cd mcmusic_flutter
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          cd mcmusic_flutter/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r McMusic.ipa Payload
          ls -la McMusic.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: McMusic-iOS-IPA
          path: mcmusic_flutter/build/ios/iphoneos/McMusic.ipa
          retention-days: 14
