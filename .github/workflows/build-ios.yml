name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mcmusic_flutter
          flutter pub get

      - name: Build iOS App with Xcode (No CodeSign)
        run: |
          cd mcmusic_flutter
          flutter build ios --release --no-codesign --config-only
          cd ios
          pod install --repo-update
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package Payload into IPA
        run: |
          cd mcmusic_flutter
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Runner.app not found in build directory!"
            find build -type d
            exit 1
          fi
          echo "Found Runner.app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r McMusic.ipa Payload
          ls -lh McMusic.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: McMusic-iOS-IPA
          path: mcmusic_flutter/build/McMusic.ipa
          retention-days: 14

      - name: Upload IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.9 mcmusic_flutter/build/McMusic.ipa --clobber || true
