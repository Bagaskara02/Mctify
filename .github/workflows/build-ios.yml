name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git release tag to upload IPA to (e.g. v1.4.4)'
        required: false
        default: 'v1.4.4'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mcmusic_flutter
          flutter pub get

      - name: Build iOS App with Flutter (No CodeSign)
        run: |
          cd mcmusic_flutter
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          cd mcmusic_flutter
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Runner.app not found in build directory!"
            find build -type d
            exit 1
          fi
          echo "Found Runner.app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -qr McTify.ipa Payload
          TAG="${{ github.event.inputs.tag || github.ref_name || 'v1.4.4' }}"
          cp McTify.ipa "McTify-${TAG}.ipa"
          ls -lh McTify.ipa "McTify-${TAG}.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: McTify-iOS-IPA
          path: |
            mcmusic_flutter/build/McTify.ipa
            mcmusic_flutter/build/McTify-*.ipa
          retention-days: 14

      - name: Upload IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name || 'v1.4.4' }}"
          echo "Uploading IPA to release tag: $TAG"
          cd mcmusic_flutter/build
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" McTify.ipa "McTify-${TAG}.ipa" --clobber
          else
            gh release create "$TAG" McTify.ipa "McTify-${TAG}.ipa" \
              --title "McTify Mobile ${TAG} (iOS IPA & Android APK)" \
              --notes "Rilis ${TAG}: Tersedia paket iOS .ipa unsigned untuk iPhone (sideload via AltStore / Sideloadly / TrollStore / Scarlet / Feather) serta Android APK terbaru."
          fi
